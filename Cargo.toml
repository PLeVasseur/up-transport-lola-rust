[package]
name = "up-transport-lola-rust"
version = "0.1.0"
edition = "2021"
description = "Eclipse S-CORE LoLa zero-copy transport for Eclipse uProtocol"
keywords = ["uProtocol", "LoLa", "S-CORE", "zero-copy", "shared-memory"]
license = "Apache-2.0"
build = "build.rs"

[features]
default = ["bundled"]
bundled = ["lola-build-from-source"]
lola-ffi = []
lola-build-from-source = ["lola-ffi"]
test-stub = []

[dependencies]
async-trait = "0.1"
tokio = { version = "1.45.1", default-features = false, features = ["rt", "sync", "time"] }
up-rust = { git = "https://github.com/PLeVasseur/up-rust.git", rev = "922a0afcb02a368b05b2a70d92c62049dab52be6" }

[build-dependencies]

[dev-dependencies]
protobuf = { version = "3.7.2", features = ["with-bytes"] }
tokio = { version = "1.45.1", default-features = false, features = ["macros", "rt"] }
up-rust = { git = "https://github.com/PLeVasseur/up-rust.git", rev = "922a0afcb02a368b05b2a70d92c62049dab52be6", features = ["protobuf-wire"] }

[package.metadata.docs.rs]
no-default-features = true
features = ["test-stub"]
