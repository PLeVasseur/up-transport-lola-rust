[package]
name = "up-transport-lola-rust"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Eclipse S-CORE LoLa transport skeleton for Eclipse uProtocol"
keywords = ["uProtocol", "LoLa", "S-CORE", "transport"]
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/eclipse-uprotocol/up-transport-lola-rust"
build = "build.rs"

[features]
default = ["bundled"]
bundled = ["lola-build-from-source"]
lola-build-from-source = ["lola-ffi"]
lola-ffi = []
zero-copy = []
benchmark-owned = ["up-rust/owned-frame-transport"]
payload-contract-benchmarks = ["up-rust/payload-contract-fixtures"]
payload-contract-large-benchmarks = [
    "payload-contract-benchmarks",
    "up-rust/payload-contract-large-fixtures",
]
test-stub = []

[[bench]]
name = "transport_criterion"
harness = false

[dependencies]
async-trait = "0.1"
bytes = "1"
protobuf = { version = "3.7.2", features = ["with-bytes"] }
tokio = { version = "1.45.1", default-features = false, features = ["rt", "sync", "time"] }
up-rust = { git = "ssh://git@github.com/PLeVasseur/up-rust.git", rev = "e60a43987ee23d3da7d6e75bd9c6f92264823cbd", default-features = false, features = ["protobuf-wire", "selected-wire-user-api", "transport-implementer-api", "wire-implementer-api"] }

[dev-dependencies]
criterion = { version = "0.5.1", features = ["csv_output"] }
up-wire-xcdrv2 = { git = "ssh://git@github.com/PLeVasseur/up-wire-xcdrv2-rust.git", rev = "3a89a4699486d0bf37447a5c2d03ce4261b0dcfa" }

[package.metadata.docs.rs]
no-default-features = true
features = ["test-stub"]
rustdoc-args = ["--cfg", "docsrs"]

[lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(docsrs)'] }
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[lints.clippy]
missing_safety_doc = "deny"
undocumented_unsafe_blocks = "deny"
