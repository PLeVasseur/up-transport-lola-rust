[package]
name = "up-transport-lola-rust"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Eclipse S-CORE LoLa transport skeleton for Eclipse uProtocol"
keywords = ["uProtocol", "LoLa", "S-CORE", "transport"]
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/eclipse-uprotocol/up-transport-lola-rust"

[features]
default = []
native = []
test-stub = []

[package.metadata.docs.rs]
no-default-features = true
features = ["test-stub"]
rustdoc-args = ["--cfg", "docsrs"]

[lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(docsrs)'] }
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[lints.clippy]
missing_safety_doc = "deny"
undocumented_unsafe_blocks = "deny"
