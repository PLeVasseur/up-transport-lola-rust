[package]
name = "up-transport-lola-rust"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Eclipse S-CORE LoLa transport skeleton for Eclipse uProtocol"
keywords = ["uProtocol", "LoLa", "S-CORE", "transport"]
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/eclipse-uprotocol/up-transport-lola-rust"
build = "build.rs"

[features]
default = ["bundled"]
bundled = ["lola-build-from-source"]
lola-build-from-source = ["lola-ffi"]
lola-ffi = []
zero-copy = []
benchmark-owned = ["up-rust/owned-frame-transport"]
payload-contract-benchmarks = []
payload-contract-large-benchmarks = ["payload-contract-benchmarks"]
test-stub = []

[[bench]]
name = "transport_criterion"
harness = false

[dependencies]
async-trait = "0.1"
protobuf = { version = "3.7.2", features = ["with-bytes"] }
tokio = { version = "1.45.1", default-features = false, features = ["rt", "sync", "time"] }
up-rust = { git = "ssh://git@github.com/PLeVasseur/up-rust.git", rev = "26d70ef45af61fdd17d3e130845a5be155154b2e" }

[dev-dependencies]
criterion = { version = "0.5.1", features = ["csv_output"] }
up-wire-xcdrv2 = { git = "ssh://git@github.com/PLeVasseur/up-wire-xcdrv2-rust.git", rev = "4092ba75e24f4f96b7088f37016c78ac75aa5c05" }

[package.metadata.docs.rs]
no-default-features = true
features = ["test-stub"]
rustdoc-args = ["--cfg", "docsrs"]

[lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(docsrs)'] }
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[lints.clippy]
missing_safety_doc = "deny"
undocumented_unsafe_blocks = "deny"
