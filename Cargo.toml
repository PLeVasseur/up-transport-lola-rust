[package]
name = "up-transport-lola-rust"
version = "0.2.0"
edition = "2021"
rust-version = "1.88"
description = "Eclipse S-CORE LoLa zero-copy transport for Eclipse uProtocol"
keywords = ["uProtocol", "LoLa", "S-CORE", "zero-copy", "shared-memory"]
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/eclipse-uprotocol/up-transport-lola-rust"
build = "build.rs"

[features]
default = ["bundled"]
bundled = ["lola-build-from-source"]
benchmark-owned = ["up-rust/owned-frame-transport"]
lola-ffi = []
lola-build-from-source = ["lola-ffi"]
payload-contract-benchmarks = ["up-rust/payload-contract-fixtures"]
payload-contract-large-benchmarks = [
    "payload-contract-benchmarks",
    "up-rust/payload-contract-large-fixtures",
]
test-stub = []

[[bench]]
name = "transport_criterion"
harness = false
required-features = ["benchmark-owned"]

[dependencies]
async-trait = "0.1"
tokio = { version = "1.45.1", default-features = false, features = ["rt", "sync", "time"] }
up-rust = { version = "=0.10.0-SNAPSHOT", git = "https://github.com/PLeVasseur/up-rust.git", rev = "7a82babfa7f94aed5b7aac1ac81babff20747bf2", default-features = false, features = ["protobuf-wire", "selected-wire-user-api", "transport-implementer-api", "wire-implementer-api", "zero-copy-transport"] }

[dev-dependencies]
criterion = { version = "0.5.1", features = ["csv_output"] }
# Addresses https://rustsec.org/advisories/RUSTSEC-2026-0204.
crossbeam-epoch = "0.9.20"
protobuf = { version = "3.7.2", features = ["with-bytes"] }
serde_json = "1.0.145"
tokio = { version = "1.45.1", default-features = false, features = ["macros", "rt"] }
up-rust = { version = "=0.10.0-SNAPSHOT", git = "https://github.com/PLeVasseur/up-rust.git", rev = "7a82babfa7f94aed5b7aac1ac81babff20747bf2", features = ["protobuf-wire", "test-util"] }
up-wire-xcdrv2 = { version = "=0.0.0", git = "https://github.com/PLeVasseur/up-wire-xcdrv2-rust.git", rev = "ce0c4ca12cdb44fafbd5aa5adc1fa8f26451e625" }

[package.metadata.docs.rs]
no-default-features = true
features = ["test-stub"]
rustdoc-args = ["--cfg", "docsrs"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(docsrs)'] }
unsafe_op_in_unsafe_fn = "deny"
missing_unsafe_on_extern = "deny"
unsafe_attr_outside_unsafe = "deny"
unused_unsafe = "deny"
deprecated_safe_2024 = "deny"
ffi_unwind_calls = "deny"
static_mut_refs = "deny"
clashing_extern_declarations = "deny"

[lints.clippy]
missing_safety_doc = "deny"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
unnecessary_safety_comment = "deny"
unnecessary_safety_doc = "deny"
borrow_as_ptr = "deny"
ptr_as_ptr = "deny"
as_ptr_cast_mut = "deny"
as_pointer_underscore = "deny"
not_unsafe_ptr_arg_deref = "deny"
transmute_ptr_to_ptr = "deny"
transmute_ptr_to_ref = "deny"
