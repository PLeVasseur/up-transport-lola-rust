name: Check

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - ".github/**"
      - "Cargo.*"
      - "clippy.toml"
      - "build.rs"
      - "cpp/**"
      - "src/**"
      - "scripts/**"
      - "tests/**"
      - "third_party/**"
      - "tools/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  fmt:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --check

  miri-test-stub:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - name: Run Miri test-stub checks
        run: scripts/run-miri-test-stub.sh

  test:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: stub
            cargo_flags: --no-default-features --features test-stub
            test_args: ""
            needs_bazel: false
          - name: bundled-native
            cargo_flags: ""
            test_args: ""
            needs_bazel: true
          - name: native-runtime
            cargo_flags: ""
            test_args: -- --ignored
            needs_bazel: true
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install native build dependencies
        if: matrix.needs_bazel
        run: sudo apt-get update && sudo apt-get install -y build-essential curl git

      - name: Bootstrap Bazelisk
        if: matrix.needs_bazel
        run: |
          scripts/run-native-validation.sh bootstrap
          version=$(tr -d '[:space:]' < tools/bazelisk.version)
          echo "BAZEL=${GITHUB_WORKSPACE}/.cache/tools/bazelisk-${version}-linux-amd64" >> "$GITHUB_ENV"

      - name: Check
        run: cargo check --all-targets ${{ matrix.cargo_flags }}

      - name: Test
        run: cargo test --all-targets ${{ matrix.cargo_flags }} ${{ matrix.test_args }}

      - name: Clippy
        run: cargo clippy --all-targets ${{ matrix.cargo_flags }} -- -D warnings

  docs:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential curl git
      - name: Bootstrap Bazelisk
        run: |
          scripts/run-native-validation.sh bootstrap
          version=$(tr -d '[:space:]' < tools/bazelisk.version)
          echo "BAZEL=${GITHUB_WORKSPACE}/.cache/tools/bazelisk-${version}-linux-amd64" >> "$GITHUB_ENV"
      - name: Build docs
        run: RUSTDOCFLAGS=-Dwarnings cargo doc --no-deps
