name: Benchmark Guardrail Advisory

on:
  pull_request:
    paths:
      - "benches/**"
      - "scripts/bench_transport_criterion.sh"
      - "Cargo.*"
      - ".github/workflows/benchmark-guardrail-advisory.yaml"
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings
  TRANSPORT_BENCH_PROFILE: core
  LOLA_BENCH_BACKEND: test-stub
  CRITERION_ARGS: --sample-size 10 --warm-up-time 1 --measurement-time 2 --noise-threshold 0.05

jobs:
  lola-transport-benchmark-advisory:
    runs-on: ubuntu-22.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - name: Compile test-stub transport benchmark
        run: cargo bench --no-default-features --features "test-stub benchmark-owned" --bench transport_criterion --no-run
      - name: Run test-stub correctness smoke benchmark
        run: scripts/bench_transport_criterion.sh candidate ci_smoke_lola_stub
      - name: Export advisory artifacts
        if: always()
        run: scripts/bench_transport_criterion.sh export
      - name: Upload advisory artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lola-transport-benchmark-advisory
          path: target/transport-perf/lola
          if-no-files-found: warn
